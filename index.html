<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Casa Pasinetti Interiores 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage; brand top-left, room switcher docked at the bottom like a plan legend. Single cream theme (brand). */
:root {
  --cream: #f1ebe2;
  --paper: rgba(246, 241, 233, 0.86);
  --ink: #3b2a1f;
  --ink-soft: #7a6656;
  --line: rgba(59, 42, 31, 0.16);
  --bronze: #84664e;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--cream); color: var(--ink); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; }
.brand {
  position: fixed; z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  left: max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 2px; pointer-events: none;
  padding: 10px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.brand .name { font-family: var(--display); font-size: clamp(22px, 3.2vw, 30px); letter-spacing: 0.01em; line-height: 1.05; }
.brand .unit { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
.dock {
  position: fixed; z-index: 3;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;
  pointer-events: none;
}
.rooms {
  pointer-events: auto;
  display: flex; flex-wrap: wrap; gap: 4px; padding: 4px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.rooms .tag { align-self: center; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); padding: 0 6px 0 10px; }
.rooms .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }
.rooms button {
  font: 500 13px/1 var(--sans); letter-spacing: 0.02em; color: var(--ink);
  background: transparent; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer;
}
.rooms button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.rooms button:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.hint { pointer-events: none; font-size: 12px; color: var(--ink-soft); background: var(--paper); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); }
.loader {
  position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; background: var(--cream);
  transition: opacity 0.6s ease;
}
.loader p { font-family: var(--display); font-size: 20px; color: var(--ink-soft); margin: 0; }
.loader.done { opacity: 0; pointer-events: none; }
.note { top: calc(env(safe-area-inset-top, 0px) + 64px) !important;
  position: fixed; z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 300px; font-size: 11px; line-height: 1.45; color: var(--ink-soft); text-align: right; margin: 0;
  padding: 8px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
}
.dock { flex-direction: column; }
.dock .row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
#units button[aria-pressed="true"] { background: var(--bronze); color: var(--cream); }
@media (max-width: 640px) {
  .note, .hint, #rooms .tag, .rooms .sep { display: none; }
  .rooms { border-radius: 18px; justify-content: center; }
  .rooms button { padding: 9px 11px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { .loader { transition: none; } }
</style>
</head><body>

<div id="stage" aria-label="Interiores 3D da Casa Pasinetti"></div>
<a class="back" href="https://casapasinetti.htmly.com.br/" style="position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 18px);right:max(16px,env(safe-area-inset-right,0px));font:500 12px/1 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:10px 14px;text-decoration:none">← Voltar ao prédio</a>
<div class="brand"><span class="name">Casa Pasinetti</span><span class="unit" id="unit">Comfort Living · interior 3D</span></div>
<p class="note" id="note">Modelo procedural a partir da planta e dos renders. Planta fora de escala: medidas aproximadas.</p>
<div class="dock">
  <div class="row"><div class="rooms" role="group" aria-label="Tipologias" id="units"></div></div>
  <div class="row">
    <div class="rooms" role="group" aria-label="Ambientes" id="rooms"></div>
    <div class="rooms" role="group" aria-label="Paredes da maquete" id="walls"></div>
    <span class="hint" id="hint">Arraste para girar a maquete</span>
  </div>
</div>
<div class="loader" id="loader"><p>Montando os interiores…</p></div>

<script src="dist/apartamento.js"></script>
<script>
(function () {
  var api = window.mountPasinettiApartment(document.getElementById('stage'), { assetBase: 'assets/' });
  var rooms = document.getElementById('rooms');
  var unitsEl = document.getElementById('units');
  var hint = document.getElementById('hint');
  var unitText = {
    smart: 'Smart Living · ambiente único', comfort: 'Comfort Living · 1 quarto', exclusive: 'Exclusive Living · 2 quartos',
    luxury: 'Luxury Living · 3 quartos', gym: 'Fitness studio · térreo'
  };
  var noteText = {
    smart: 'Unidade A1.1 · 1º andar, lado do jardim interno. Portas de vidro levam a dois terraços com guarda-corpo e floreiras.',
    comfort: 'Unidade C4.2 · 4º andar, ponta leste, lado da rua. Quarto e sala têm janelas de piso a teto com guarda-corpo, sem sacada. Sala e cozinha abrem para a loggia.',
    exclusive: 'Unidade C1.1 · 1º andar, esquina nordeste. A sala abre para o terraço do lado do jardim. Os quartos têm janelas de piso a teto com guarda-corpo.',
    luxury: 'Unidade C6.1 · 6º andar recuado, ponta leste. Terraço em L voltado para a rua e para a lateral; sala e dois quartos abrem para ele.',
    gym: 'Fitness room do térreo, voltada para a rua. Equipamentos modelados em código, sem marcas. Espelho com reflexo real.',
    _: 'Medidas calibradas pela planta do arquiteto (KEYPLAN 1:100).'
  };

  var unitButtons = {}, buttons = {}, currentScene = null;
  api.scenes.forEach(function (sc) {
    if (sc.key === 'gym') { var sep = document.createElement('span'); sep.className = 'sep'; unitsEl.appendChild(sep); }
    var b = document.createElement('button');
    b.type = 'button'; b.id = 'unit-' + sc.key; b.textContent = sc.label;
    b.addEventListener('click', function () { var first = api.views.filter(function (v) { return v.scene === sc.key; })[0]; go(first.name, true); });
    unitsEl.appendChild(b); unitButtons[sc.key] = b;
  });
  function sceneOf(name) { var v = api.views.filter(function (x) { return x.name === name; })[0]; return v ? v.scene : null; }
  function renderRooms(scene) {
    rooms.innerHTML = ''; buttons = {};
    api.views.filter(function (v) { return v.scene === scene; }).forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button'; b.id = 'view-' + v.name; b.textContent = v.label;
      b.addEventListener('click', function () { go(v.name, true); });
      rooms.appendChild(b); buttons[v.name] = b;
    });
  }
  var walls = document.getElementById('walls');
  var wallButtons = {};
  var wtag = document.createElement('span'); wtag.className = 'tag'; wtag.textContent = 'Paredes'; walls.appendChild(wtag);
  [['inteira', 'Inteiras'], ['vidro', 'Vidro']].forEach(function (w) {
    var b = document.createElement('button');
    b.type = 'button'; b.id = 'walls-' + w[0]; b.textContent = w[1];
    b.addEventListener('click', function () { setWalls(w[0]); });
    walls.appendChild(b); wallButtons[w[0]] = b;
  });
  function setWalls(m) {
    api.setWallMode(m);
    Object.keys(wallButtons).forEach(function (k) { wallButtons[k].setAttribute('aria-pressed', String(k === m)); });
  }
  setWalls('inteira');
  var loader = document.getElementById('loader');
  function go(name, push) {
    var scene = sceneOf(name);
    if (!scene) { name = 'maquete'; scene = 'comfort'; }
    var apply = function () {
      api.setView(name, !!currentScene && currentScene === scene);
      if (scene !== currentScene) { renderRooms(scene); currentScene = scene; }
      Object.keys(unitButtons).forEach(function (k) { unitButtons[k].setAttribute('aria-pressed', String(k === scene)); });
      Object.keys(buttons).forEach(function (k) { buttons[k].setAttribute('aria-pressed', String(k === name)); });
      var v = api.views.filter(function (x) { return x.name === name; })[0];
      var overview = !!(v && v.overview);
      walls.hidden = !overview;
      hint.textContent = overview ? 'Arraste para girar a maquete' : 'Arraste para olhar em volta';
      document.getElementById('unit').textContent = unitText[scene];
      document.getElementById('note').textContent = noteText[scene] || noteText._;
      if (push && location.hash.slice(1) !== name) location.hash = name;
      setTimeout(function () { loader.classList.add('done'); }, 250);
    };
    if (!api.isBuilt(scene)) { loader.querySelector('p').textContent = 'Montando ' + unitText[scene].split(' ·')[0] + '…'; loader.classList.remove('done'); setTimeout(apply, 60); }
    else apply();
  }
  window.addEventListener('hashchange', function () { go(location.hash.slice(1), false); });
  go(location.hash.slice(1) || 'maquete', false);
})();
</script>

</body></html>
