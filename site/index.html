<style>

a{color:#6B4A35}a:hover{color:#3A2418}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #6B4A35;outline-offset:2px}

@keyframes preal{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:scale(1)}}
@keyframes prealui{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pviews{scrollbar-width:none}.pviews::-webkit-scrollbar{display:none}.pviews>button{flex:none}
@media (max-width:720px){
.ph{display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px!important;padding:10px 16px 0!important;position:sticky;top:0;z-index:30;background:rgba(246,241,233,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.phl{display:contents!important}
.plogo{grid-column:1;grid-row:1;gap:10px!important;min-width:0}
.plogo img{height:32px!important}
.pex{font-size:9px!important;letter-spacing:.16em!important;max-width:86px!important}

.pcta{display:none!important}
.plang button{min-width:40px!important;min-height:36px!important;padding:0 8px!important}
.pnav{grid-column:1/-1;grid-row:2;flex-wrap:nowrap!important;overflow-x:auto;gap:0 22px!important;margin:0 -16px;padding:0 16px;border-top:1px solid #E3D9CC;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.pnav::-webkit-scrollbar{display:none}
.pnav>a{flex:none;white-space:nowrap;padding:11px 0!important}
}
html{scroll-padding-top:72px}@media (max-width:720px){html{scroll-padding-top:104px}}
.ph{position:sticky;top:0;z-index:30;background:rgba(250,247,241,.66)!important;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.6)!important;box-shadow:0 1px 0 rgba(75,42,29,.07),0 14px 30px -24px rgba(40,24,14,.35)}
.p3d{padding:14px clamp(16px,3vw,32px) 18px;background:linear-gradient(180deg,#EFE7DC 0%,#F6F1E9 100%);border-top:1px solid #E3D9CC}
.p3d-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:14px 16px 14px 22px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,253,248,.5));border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(75,42,29,.05),0 18px 40px -26px rgba(40,24,14,.45);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.p3d-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.p3d-t{font:500 24px/1.1 'Bodoni Moda','Didot',Georgia,serif;color:#4B2A1D}
.p3d-s{font:400 13px/1.4 'Instrument Sans',sans-serif;color:#715E4F}
.p3d-btns{display:flex;flex-wrap:wrap;gap:8px}
.pglass-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;font:500 14px/1 'Instrument Sans',sans-serif;text-decoration:none;color:#4B2A1D;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.45));border:1px solid rgba(75,42,29,.18);box-shadow:inset 0 1px 0 #fff,0 6px 16px -10px rgba(40,24,14,.4);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s cubic-bezier(.2,.8,.2,1)}
.pglass-btn.is-dark{color:#FBF8F2;background:linear-gradient(180deg,#5d3a2b,#43251a);border-color:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 18px -10px rgba(40,24,14,.6)}
.pglass-btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 #fff,0 10px 22px -12px rgba(40,24,14,.5)}
.pglass-btn.is-dark:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 24px -12px rgba(40,24,14,.7)}
::selection{background:#E7D3C2;color:#3A2418}
@media (max-width:720px){.p3d-in{padding:14px;border-radius:18px}.p3d-btns{width:100%}.pglass-btn{flex:1 1 auto;justify-content:center;padding:0 12px}}
@media (prefers-reduced-motion:reduce){.pglass-btn{transition:none}}

#pz-splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:24px;background:#F6F1E9;color:#4B2A1D;transition:opacity .6s cubic-bezier(.16,1,.3,1),visibility .6s}
#pz-splash .pz-in{display:grid;justify-items:center;width:min(360px,82vw);text-align:center;animation:pz-rise .8s cubic-bezier(.16,1,.3,1) both}
#pz-splash.pz-cont .pz-in{animation:none}
#pz-splash .pz-name{font:400 clamp(34px,9vw,48px)/1 'Bodoni Moda','Bodoni 72','Didot',Georgia,serif;letter-spacing:-.015em;text-wrap:balance}
#pz-splash .pz-sub{margin-top:12px;font:400 13px/1.4 'Instrument Sans',system-ui,-apple-system,sans-serif;color:#7A6656}
#pz-splash .pz-bar{width:100%;height:2px;margin-top:36px;background:rgba(75,42,29,.14);border-radius:2px;overflow:hidden}
#pz-splash .pz-fill{height:100%;background:#4B2A1D;border-radius:2px;transform:scaleX(0);transform-origin:0 50%;transition:transform .35s cubic-bezier(.16,1,.3,1);will-change:transform}
#pz-splash .pz-meta{display:flex;justify-content:space-between;width:100%;margin-top:12px;font:500 12px/1 'Instrument Sans',system-ui,-apple-system,sans-serif;color:#7A6656;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#pz-splash .pz-logo{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);width:104px;height:auto;opacity:.9}
#pz-splash.pz-out{opacity:0;visibility:hidden}
#pz-splash.pz-out .pz-in{transform:translateY(-8px);filter:blur(6px);transition:transform .6s cubic-bezier(.16,1,.3,1),filter .6s cubic-bezier(.16,1,.3,1)}
html.pz-lock,html.pz-lock body{overflow:hidden}
@keyframes pz-rise{from{opacity:0;transform:translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){#pz-splash,#pz-splash .pz-in,#pz-splash .pz-fill{animation:none!important;transition:none!important}}
</style>

<body>
<div id="pz-splash" role="status" aria-live="polite"><div class="pz-in"><div class="pz-name">Casa Pasinetti</div><div class="pz-sub">Milão · ao lado da Fondazione Prada</div><div class="pz-bar"><div class="pz-fill"></div></div><div class="pz-meta"><span class="pz-lab">Carregando</span><span class="pz-pct">0%</span></div></div><img class="pz-logo" src="assets/img/gobbi-internacional.png" alt="Gobbi Internacional" width="129" height="40"></div>

<script>(function(){var el=document.getElementById('pz-splash');if(!el)return;document.documentElement.classList.add('pz-lock');
var fill=el.querySelector('.pz-fill'),pct=el.querySelector('.pz-pct'),lab=el.querySelector('.pz-lab'),cur=0,out=false,shown=-1;
if(window.__pzP){el.classList.add('pz-cont');cur=window.__pzP;fill.style.transition='none';fill.style.transform='scaleX('+cur+')';void fill.offsetWidth;fill.style.transition='';}
var PZ=window.PZ={set:function(p,label,slow){if(out)return;p=Math.min(1,Math.max(cur,p));cur=p;fill.style.transitionDuration=(slow||.35)+'s';fill.style.transitionTimingFunction=slow?'cubic-bezier(.12,.6,.25,1)':'';fill.style.transform='scaleX('+p.toFixed(4)+')';if(label&&lab.textContent!==label)lab.textContent=label;},
value:function(){return cur;},
done:function(label){if(out)return;PZ.set(1,label||'Pronto');out=true;setTimeout(function(){el.classList.add('pz-out');document.documentElement.classList.remove('pz-lock');setTimeout(function(){el.remove();},700);},380);}};
(function tick(){var m=getComputedStyle(fill).transform,v=0;if(m&&m!=='none')v=parseFloat(m.slice(m.indexOf('(')+1));var n=Math.min(100,Math.round(v*100));if(n!==shown){shown=n;pct.textContent=n+'%';}if(el.isConnected)requestAnimationFrame(tick);})();})();

(function(){var PZ=window.PZ;if(!PZ)return;var t0=Date.now(),built=false;
// direct visit (no loader page): byte weights of the four scripts, filled as Resource Timing reports each one finished
if(!window.__pzP){var W={'config':453,'three.min':667796,'runtime':8153,'casa-pasinetti':285668},T=0,D=0,seen={};for(var k in W)T+=W[k];
PZ.set(.04,'Baixando o 3D');requestAnimationFrame(function(){requestAnimationFrame(function(){PZ.set(.4,null,8);});});
var take=function(list){list.forEach(function(e){var m=/assets\/js\/([a-z.\-]+)\.js/.exec(e.name);if(m&&W[m[1]]&&!seen[m[1]]){seen[m[1]]=1;D+=W[m[1]];var p=.04+.8*D/T;PZ.set(p,'Baixando o 3D');if(D<T)PZ.set(Math.min(.84,p+.25),null,5);else build();}});};
try{new PerformanceObserver(function(l){take(l.getEntries());}).observe({type:'resource',buffered:true});}catch(e){}}

if(dc)build();
if((st&&(st.ready||st.glErr))||Date.now()-t0>30000){clearInterval(iv);requestAnimationFrame(function(){requestAnimationFrame(function(){PZ.done();});});}},100);})();</script>
<noscript><p style="font:16px/1.5 sans-serif;padding:24px;color:#3A2A20">Ative o JavaScript para ver a maquete do Casa Pasinetti.</p></noscript>
<template id="dc-tpl">

<div lang="{{t.code}}" style="min-height: 100vh; background: #F6F1E9; color: #3A2A20; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, sans-serif; display: flex; flex-direction: column">

<header class="ph" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 14px clamp(16px, 3vw, 32px); border-bottom: 1px solid #E3D9CC">
<div class="phl" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px">
<div class="plogo" style="display: flex; align-items: center; gap: 14px"><a href="#maquete" aria-label="Gobbi Internacional" style="display: block; padding: 4px 0; line-height: 0"><img src="assets/img/gobbi-internacional.png" alt="Gobbi Internacional" width="129" height="40" style="display: block; width: auto; height: 40px"></a><span style="align-self: stretch; width: 1px; margin: 6px 0; background: #D9CCBC"></span><span class="pex" style="font: 600 10px/1.35 'Instrument Sans', sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: #5C4636; max-width: 120px">{{t.presentedBy}}</span></div>
<nav class="pnav" aria-label="{{t.navAria}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 14px">
<a href="#maquete" style="color: #56463A; text-decoration: none; padding: 12px 0">{{t.navModel}}</a>
<a href="#projeto" style="color: #56463A; text-decoration: none; padding: 12px 0">{{t.navProject}}</a>
<a href="#vida" style="color: #56463A; text-decoration: none; padding: 12px 0">{{t.navLife}}</a>
<a href="#interiores" style="color: #56463A; text-decoration: none; padding: 12px 0">{{t.navInt}}</a>
<a href="#bairro" style="color: #56463A; text-decoration: none; padding: 12px 0">{{t.navArea}}</a>
<a href="#galeria" style="color: #56463A; text-decoration: none; padding: 12px 0">{{t.navGallery}}</a>
</nav>
</div>
<div class="phr" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<div class="plang" role="group" aria-label="{{t.langAria}}" style="display: flex; gap: 2px; padding: 2px; border: 1px solid #D2C4B3; border-radius: 999px">
<sc-for list="{{langs}}" as="lg" hint-placeholder-count="3">
<button type="button" lang="{{lg.code}}" aria-pressed="{{lg.pressed}}" aria-label="{{lg.name}}" onClick="{{lg.pick}}" style="min-width: 44px; min-height: 38px; padding: 0 10px; border: 0; border-radius: 999px; font: 600 12px/1 'Instrument Sans', sans-serif; letter-spacing: 0.08em; cursor: pointer; {{lg.style}}">{{lg.label}}</button>
</sc-for>
</div>
<a class="pcta" href="{{visitHref}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: 1px solid #6B4A35; border-radius: 999px; color: #6B4A35; text-decoration: none; font: 600 14px/1 'Instrument Sans', sans-serif">{{t.cta}}</a>
</div>
</header>

<main id="maquete" style="display: flex; flex-wrap: wrap; align-items: stretch">

<section aria-label="{{t.navModel}}" style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding: 12px clamp(16px, 3vw, 32px); border-bottom: 1px solid #E3D9CC">
<div role="group" aria-label="{{t.typeAria}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font: 600 11px/1.2 'Instrument Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #735F50; margin-right: 6px">{{t.typology}}</span>
<sc-for list="{{typeChips}}" as="c" hint-placeholder-count="5">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px; font: 500 13px/1 'Instrument Sans', sans-serif; cursor: pointer; {{c.style}}">{{c.label}}<span style="font-size: 11px; opacity: 0.7">{{c.count}}</span></button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px">
<label style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 14px; color: #3A2A20; white-space: nowrap">
<input type="checkbox" checked="{{onlyAvail}}" onChange="{{toggleAvail}}" style="width: 18px; height: 18px; margin: 0; accent-color: #6B4A35">
{{t.onlyAvail}}
</label>
<label style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 14px; color: #3A2A20; white-space: nowrap">
<input type="checkbox" checked="{{statusOn}}" onChange="{{toggleMode}}" style="width: 18px; height: 18px; margin: 0; accent-color: #6B4A35">
{{t.colorize}}
</label>
</div>
</div>

<div ref="{{stageRef}}" style="position: relative; flex: 1 0 auto; min-height: clamp(540px, 54vw, 790px); max-height: 980px; overflow: hidden; background: {{ov.bg}}">
<canvas ref="{{canvasRef}}" role="img" aria-label="{{t.canvasAria}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y"></canvas>

<sc-if value="{{realV.on}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="{{realV.title}}" style="position: absolute; inset: 0; z-index: 5; overflow: hidden; background: #EEE6DA; animation: preal 0.75s cubic-bezier(.2,.7,.2,1) 0.85s both">
<img src="{{realV.src}}" alt="{{realV.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block">
<span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 9, 8, 0.45) 0%, rgba(10, 9, 8, 0) 26%, rgba(10, 9, 8, 0) 58%, rgba(10, 9, 8, 0.78) 100%); pointer-events: none"></span>
<button type="button" onClick="{{realClose}}" style="position: absolute; top: clamp(14px, 2.2vw, 24px); right: clamp(14px, 2.4vw, 28px); display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.62); background: rgba(252, 250, 246, 0.52); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px -12px rgba(40, 24, 14, 0.32); color: #3A2A20;  font: 600 13px/1 'Instrument Sans', sans-serif; cursor: pointer; animation: prealui 0.5s ease 1.3s both"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3.3 7.5L12 12l8.7-4.5M12 12v9"></path></svg>{{t.realBack}}</button>
<div style="position: absolute; left: clamp(16px, 3vw, 32px); right: clamp(16px, 3vw, 32px); bottom: clamp(16px, 2.6vw, 28px); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; animation: prealui 0.5s ease 1.3s both">
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 560px">
<span style="font: 600 11px/1.2 'Instrument Sans', sans-serif; letter-spacing: 0.2em; text-transform: uppercase; color: #F1E6D4">Casa Pasinetti · {{realV.count}}</span>
<span style="font: 500 clamp(28px, 3.4vw, 44px)/1.02 'Bodoni Moda', 'Didot', Georgia, serif; color: #FFFFFF">{{realV.title}}</span>
<span style="font-size: 14px; line-height: 1.5; color: #E8E3DA">{{realV.desc}}</span>
</div>
<sc-if value="{{realV.multi}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px">
<button type="button" aria-label="{{t.prev}}" onClick="{{realPrev}}" style="display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.62); background: rgba(252, 250, 246, 0.52); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px -12px rgba(40, 24, 14, 0.32); color: #3A2A20;  cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" aria-label="{{t.next}}" onClick="{{realNext}}" style="display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.62); background: rgba(252, 250, 246, 0.52); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px -12px rgba(40, 24, 14, 0.32); color: #3A2A20;  cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</sc-if>
</div>
</div>
</sc-if>
<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; background: {{ov.bg}}; pointer-events: none">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; color: {{ov.hint}}; font-size: 14px">
<span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #D2C4B3; border-top-color: #6B4A35; animation: pspin 0.9s linear infinite"></span>
{{t.loading}}
</div>
</div>
</sc-if>
<sc-if value="{{glErr}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 24px; background: #EEE6DA; text-align: center">
<p style="margin: 0; max-width: 420px; font-size: 15px; line-height: 1.5; color: #56463A">{{t.glErr}}</p>
</div>
</sc-if>

<div style="position: absolute; z-index: 2; left: clamp(16px, 3vw, 32px); top: clamp(16px, 2.4vw, 28px); max-width: min(560px, 70%); display: flex; flex-direction: column; gap: 8px; pointer-events: none; text-shadow: 0 1px 14px rgba(8, 18, 36, 0.38)">
<span style="font: 600 11px/1.2 'Instrument Sans', sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: {{ov.eyebrow}}">{{t.eyebrow}}</span>

</sc-if>
<sc-if value="{{focusOn}}" hint-placeholder-val="{{ false }}">

</sc-if>

<div style="position: absolute; z-index: 2; left: clamp(16px, 3vw, 32px); right: clamp(16px, 3vw, 32px); bottom: clamp(16px, 2.4vw, 24px); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; pointer-events: none">

</sc-if>
<sc-if value="{{showLegend}}" hint-placeholder-val="{{ false }}">

</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; min-width: 0; max-width: 100%; pointer-events: auto">

<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"></path></svg></sc-if>
</button>
<select aria-label="{{t.dateAria}}" value="{{month}}" onChange="{{setMonth}}" style="min-height: 38px; padding: 0 10px; border: 0; border-radius: 999px; background: #EEE6DA; color: #3A2A20; font: 500 13px/1 'Instrument Sans', sans-serif; cursor: pointer">

<button type="button" onClick="{{realOpen}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: #4B2A1D; color: #FBF8F2; font: 600 13px/1 'Instrument Sans', sans-serif; white-space: nowrap; cursor: pointer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>{{t.realBtn}}</button>
<button type="button" onClick="{{viewStreet}}" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #3A2A20; font: 500 13px/1 'Instrument Sans', sans-serif; cursor: pointer">{{t.street}}</button>
<button type="button" onClick="{{viewGarden}}" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #3A2A20; font: 500 13px/1 'Instrument Sans', sans-serif; cursor: pointer">{{t.garden}}</button>
<button type="button" onClick="{{viewAir}}" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #3A2A20; font: 500 13px/1 'Instrument Sans', sans-serif; cursor: pointer">{{t.aerial}}</button>
<button type="button" onClick="{{viewGarage}}" aria-pressed="{{garageOn}}" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; {{garageBtnStyle}} font: 500 13px/1 'Instrument Sans', sans-serif; white-space: nowrap; cursor: pointer">{{t.garageBtn}}</button>
<button type="button" onClick="{{viewSun}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #6B4A35; font: 500 13px/1 'Instrument Sans', sans-serif; cursor: pointer"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>{{t.sunView}}</button>
</div>
<sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">

<button type="button" aria-label="{{t.rotL}}" onClick="{{rotL}}" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.62); background: rgba(252, 250, 246, 0.52); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px -12px rgba(40, 24, 14, 0.32); color: #3A2A20; cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v4.5h4.5"></path></svg></button>
<button type="button" aria-label="{{t.rotR}}" onClick="{{rotR}}" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.62); background: rgba(252, 250, 246, 0.52); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px -12px rgba(40, 24, 14, 0.32); color: #3A2A20; cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v4.5h-4.5"></path></svg></button>
<button type="button" aria-label="{{t.zoomOut}}" onClick="{{zoomOut}}" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.62); background: rgba(252, 250, 246, 0.52); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px -12px rgba(40, 24, 14, 0.32); color: #3A2A20; cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<button type="button" aria-label="{{t.zoomIn}}" onClick="{{zoomIn}}" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.62); background: rgba(252, 250, 246, 0.52); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 10px 28px -12px rgba(40, 24, 14, 0.32); color: #3A2A20; cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</sc-if>
</div>
</div>

</div>

<div style="display: flex; flex-direction: column; gap: 6px"><dt style="font: 600 11px/1.2 'Instrument Sans', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #735F50">{{t.floor}}</dt><dd style="margin: 0; font-size: 17px; color: #3A2A20">{{card.floor}}</dd></div>
<div style="display: flex; flex-direction: column; gap: 6px"><dt style="font: 600 11px/1.2 'Instrument Sans', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #735F50">{{t.aspect}}</dt><dd style="margin: 0; font-size: 17px; color: #3A2A20">{{card.expo}}</dd></div>
</dl>
<div style="display: flex; flex-direction: column; gap: 10px">
